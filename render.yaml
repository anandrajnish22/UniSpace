services:
  - type: web
    name: unispace-backend
    env: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm install && node -e "const fs=require('fs'); let c=fs.readFileSync('prisma/schema.prisma','utf8'); fs.writeFileSync('prisma/schema.prisma', c.replace('provider = \"sqlite\"','provider = \"postgresql\"'));" && npx prisma generate && npx prisma db push && npx tsx prisma/seed_demo.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: unispace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://uni-space-rho.vercel.app

databases:
  - name: unispace-db
    databaseName: unispace
    user: unispace
    plan: free
    region: ohio
    postgresMajorVersion: 15
